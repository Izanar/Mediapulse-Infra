kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mediapulse-cluster
nodes:
  # Control Plane (Master-нода)
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  # Worker-ноды
  - role: worker
  - role: worker
  - role: worker