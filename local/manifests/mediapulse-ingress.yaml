apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mediapulse-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - host: mediapulse.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mediapulse-api-svc
                port:
                  number: 80